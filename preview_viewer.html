<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoJSON Preview Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #222; }
  .box { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  #map { height: 520px; border: 1px solid #ccc; border-radius: 6px; }

  /* preview info line under the attribution, same look as Leaflet attribution */
  .leaflet-bottom.leaflet-right { left: 0; }  /* let the info line span the whole map width */
  .leaflet-container .info-bar {
    background: rgba(255, 255, 255, 0.8);
    color: #333;
    font-size: 12px;
    font-size: 0.75rem;
    line-height: 1.4;
    padding: 0 5px;
    margin: 0;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    gap: 6px;
  }
  /* one line, cut with ... when too long */
  .info-bar .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info-bar .more { flex: none; color: #0078a8; cursor: pointer; display: none; }
  .info-bar.overflowing .more { display: inline; }
  /* expanded on hover over "show more" */
  .info-bar.expanded .text { white-space: normal; }
  .info-bar.expanded .more { display: none; }
</style>
</head>
<body>
<div class="box">
  <h1>GeoJSON preview</h1>
  <div id="map"></div>
</div>

<script>
// Preview GeoJSON generated by prepare_geojson_preview.py.
const DATA_MAP = 'test_data/czech_rivers_simplified.geojson';

const map = L.map('map', { attributionControl: false });

// Esri World Imagery basemap
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19
}).addTo(map);

fetch(DATA_MAP)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(showPreview)
  .catch(err => {
    document.getElementById('map').insertAdjacentHTML('beforebegin',
      `<p style="color:#b00">Cannot load preview from ${DATA_MAP}: ${err.message}</p>`);
  });

function showPreview(PREVIEW) {
  // bright colours so the layer is visible on aerial imagery
  const layer = L.geoJSON(PREVIEW, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 4, weight: 1, color: '#ffcc00', fillOpacity: 0.8 }),
    style: { color: '#ffcc00', weight: 1.5, fillOpacity: 0.2 },
    onEachFeature: (f, l) => {
      const props = Object.entries(f.properties || {})
        .map(([k, v]) => `<b>${k}</b>: ${v}`).join('<br>');
      if (props) l.bindPopup(props);
    }
  }).addTo(map);
  map.fitBounds(layer.getBounds());

  // info bar with ui_summary from preview_metadata
  const InfoBar = L.Control.extend({
    options: { position: 'bottomright' },
    onAdd: function () {
      const meta = PREVIEW.preview_metadata;
      const div = L.DomUtil.create('div', 'info-bar');
      L.DomEvent.disableClickPropagation(div);
      if (!meta) {
        div.textContent = 'No preview_metadata found in this file.';
        return div;
      }
      const d = meta.details;
      div.innerHTML = `
        <span class="text">${meta.status !== 'success' ? '&#9888; ' : ''}${meta.ui_summary}
          ${d.simplification_skipped ? '&middot; geometry not simplified (' + d.avg_vertices_per_feature + ' vertices per feature on average) ' : ''}
          &middot; ${meta.input_file} &middot; original ${meta.original_size_mb} MB, preview ${meta.final_size_mb} MB &middot;
          ${d.features_kept_count} of ${d.features_original_count} features shown &middot;
          original CRS ${meta.original_crs}</span>
        <span class="more">show more</span>`;

      // hovering "show more" expands the line, leaving the bar collapses it again
      div.querySelector('.more').addEventListener('mouseenter', () => div.classList.add('expanded'));
      div.addEventListener('mouseleave', () => div.classList.remove('expanded'));
      return div;
    }
  });
  const infoBar = new InfoBar();
  map.addControl(infoBar);

  // show "show more" only when the text does not fit on one line
  function checkOverflow() {
    const bar = infoBar.getContainer();
    const text = bar.querySelector('.text');
    if (text) bar.classList.toggle('overflowing', text.scrollWidth > text.clientWidth);
  }
  checkOverflow();
  window.addEventListener('resize', checkOverflow);
  L.control.attribution({ position: 'bottomright' }).addTo(map);
}
</script>
</body>
</html>
