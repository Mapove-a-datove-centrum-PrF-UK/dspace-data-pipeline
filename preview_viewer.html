<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #222; }
  .box { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  #map { height: 520px; border: 1px solid #ccc; border-radius: 6px; }

  /* preview info line under the attribution, same look as Leaflet attribution */
  .leaflet-bottom.leaflet-right { left: 0; }  /* let the info line span the whole map width */
  .leaflet-container .info-bar {
    background: rgba(255, 255, 255, 0.8);
    color: #333;
    font-size: 0.75rem;
    line-height: 1.4;
    padding: 0 5px;
    margin: 0;
    width: 100%;
    box-sizing: border-box;
    /* one line, cut with ... when too long */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* whole text shown on hover */
  .leaflet-container .info-bar:hover { white-space: normal; }
</style>
</head>
<body>
<div class="box">
  <h1>Data preview</h1>
  <div id="map"></div>
</div>

<script>
// Vector preview: GeoJSON generated by prepare_geojson_preview.py.
// Raster preview: JSON metadata file generated by prepare_raster_preview.py (the PNG lies next to it).
const DATA_MAP = 'test_data/sentinel2_tci_preview.json';

const map = L.map('map', { attributionControl: false });

// Esri World Imagery basemap
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19
}).addTo(map);

fetch(DATA_MAP)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(showPreview)
  .catch(err => {
    document.getElementById('map').insertAdjacentHTML('beforebegin',
      `<p style="color:#b00">Cannot load preview from ${DATA_MAP}: ${err.message}</p>`);
  });

function showPreview(PREVIEW) {
  const isRaster = PREVIEW.type !== 'FeatureCollection';
  const meta = isRaster ? PREVIEW : PREVIEW.preview_metadata;

  // raster: PNG placed by image_bbox_wgs84; the path is relative to the metadata file
  const img = meta && meta.image_bbox_wgs84;
  const layer = isRaster ? L.imageOverlay(
    new URL(meta.output_file, new URL(DATA_MAP, location.href)).href,
    [[img[1], img[0]], [img[3], img[2]]]
  ) :
  // vector: GeoJSON features, with a popup showing all properties
  L.geoJSON(PREVIEW, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 4, weight: 1, color: '#ffcc00', fillOpacity: 0.8 }),
    style: { color: '#ffcc00', weight: 1.5, fillOpacity: 0.2 },
    onEachFeature: (f, l) => {
      const props = Object.entries(f.properties || {})
        .map(([k, v]) => `<b>${k}</b>: ${v}`).join('<br>');
      if (props) l.bindPopup(props);
    }
  });

  // extent of the complete original data, from the preview metadata
  const bbox = meta && meta.original_bbox_wgs84;
  const extentBounds = bbox ? L.latLngBounds([bbox[1], bbox[0]], [bbox[3], bbox[2]]) : null;

  // The map view has to be set before any vector layer is added, otherwise Leaflet
  // draws the paths with a renderer that is not initialised yet.
  // Zoom to the displayed features; the original extent is only a fallback for a file with no features.
  const featureBounds = layer.getBounds();
  map.fitBounds(featureBounds.isValid() ? featureBounds : extentBounds);
  layer.addTo(map);

  // dashed outline of the original extent
  // Only the outline is clickable (fill: false), so clicks inside still reach the features.
  if (extentBounds) {
    L.rectangle(extentBounds, {
      color: '#ffffff', weight: 3, dashArray: '6 6', fill: false
    }).bindPopup('Original data extent').addTo(map);
  }

  // info bar with ui_summary from preview_metadata
  const infoBar = L.control({ position: 'bottomright' });
  infoBar.onAdd = () => {
    const div = L.DomUtil.create('div', 'info-bar');
    L.DomEvent.disableClickPropagation(div);
    if (!meta) {
      div.textContent = 'No preview_metadata found in this file.';
      return div;
    }
    const d = meta.details;
    div.innerHTML = `
      ${meta.status !== 'success' ? '&#9888; ' : ''}${meta.ui_summary}
      ${d.simplification_skipped ? '&middot; geometry not simplified (' + d.avg_vertices_per_feature + ' vertices per feature on average) ' : ''}
      &middot; ${meta.input_file} &middot; original ${meta.original_size_mb} MB, preview ${meta.final_size_mb} MB &middot;
      ${isRaster ? `${d.preview_width} &times; ${d.preview_height} px shown (original ${d.original_width} &times; ${d.original_height} px)`
                 : `${d.features_kept_count} of ${d.features_original_count} features shown`}`;
    return div;
  };
  infoBar.addTo(map);
  // added last so that the attribution sits above the info bar
  L.control.attribution({ position: 'bottomright' }).addTo(map);
}
</script>
</body>
</html>
